name: Trigger Private Repo Daily Fetch

on:
  schedule:
    # 北京时间 17:30 = UTC 09:30
    - cron: '50 1 * * 1-5'
  workflow_dispatch:   # 允许手动触发测试

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch event to private repo
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          OWNER: FelizFiona
          REPO: FactorsZoo
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${OWNER}/${REPO}/dispatches \
            -d '{"event_type":"trigger-data-fetch"}'